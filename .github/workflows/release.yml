name: Release desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: release }
      - name: Create checksums and manifest
        run: |
          cd release
          # GitHub release uploads normalize spaces in asset names. Normalize
          # here first so the downloadable name, checksum, and manifest agree.
          find . -type f \( -iname '*.dmg' -o -iname '*.msi' -o -iname '*.exe' -o -iname '*.AppImage' -o -iname '*.deb' \) -print0 | while IFS= read -r -d '' file; do
            directory=$(dirname "$file")
            base=$(basename "$file")
            normalized=$(printf '%s' "$base" | tr ' ' '.')
            if [ "$base" != "$normalized" ]; then
              mv "$file" "$directory/$normalized"
            fi
          done
          find . -type f -not -name SHA256SUMS -not -name latest.json -print0 | while IFS= read -r -d '' file; do
            hash=$(sha256sum "$file" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$(basename "$file")"
          done > SHA256SUMS
          tag="${GITHUB_REF_NAME:-v0.1.0}"
          mac=$(find . -type f -iname '*.dmg' -print -quit | sed 's#^.*/##')
          win=$(find . -type f \( -iname '*.exe' -o -iname '*.msi' \) -print -quit | sed 's#^.*/##')
          linux=$(find . -type f -iname '*.AppImage' -print -quit | sed 's#^.*/##')
          test -n "$mac" && test -n "$win" && test -n "$linux"
          jq -cn --arg v "${tag#v}" --arg repo "$GITHUB_REPOSITORY" --arg tag "$tag" --arg sha "$GITHUB_SHA" --arg mac "$mac" --arg win "$win" --arg linux "$linux" '{version:$v,tag:$tag,source_sha:$sha,platforms:{macos:{url:("https://github.com/"+$repo+"/releases/download/"+$tag+"/"+$mac),format:"DMG"},windows:{url:("https://github.com/"+$repo+"/releases/download/"+$tag+"/"+$win),format:"installer"},linux:{url:("https://github.com/"+$repo+"/releases/download/"+$tag+"/"+$linux),format:"AppImage"}}}' > latest.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**
      - name: Verify published source identity and downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release.mjs --repo="$GITHUB_REPOSITORY" --tag="$GITHUB_REF_NAME" --sha="$GITHUB_SHA"
